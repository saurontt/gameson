<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesOn - Teste de Campeonatos e Disputas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        form { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input, select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #message { padding: 10px; margin-top: 15px; border-radius: 5px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .list-container { list-style-type: none; padding: 0; }
        .item { background: #e9ecef; margin-bottom: 10px; padding: 15px; border-radius: 5px; border-left: 5px solid #007bff; }
        .item h3 { margin: 0 0 10px 0; }
        .item p { margin: 0 0 5px 0; color: #555; }
        .item .actions { margin-top: 15px; }
        .accept-form { margin-top: 15px; padding: 15px; border: 1px dashed #ccc; border-radius: 5px; background-color: #f9f9f9; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Criar Novo Campeonato</h1>
        <form id="form-criar-campeonato">
            <input type="hidden" id="criador_id" value="6">
            <label for="nome">Nome do Campeonato:</label>
            <input type="text" id="nome" required>
            <label for="modalidade">Modalidade:</label>
            <input type="text" id="modalidade" value="Futevôlei de Duplas" required>
            <label for="valor_inscricao">Valor da Inscrição:</label>
            <input type="number" id="valor_inscricao" step="0.01" value="50.00" required>
            <label for="premio_1">Prêmio 1º Lugar (%):</label>
            <input type="number" id="premio_1" step="0.01" value="0.6" required>
            <button type="submit">Criar Campeonato</button>
        </form>

        <div id="message"></div>

        <h2>Campeonatos Abertos</h2>
        <ul id="campeonatos-list" class="list-container">
            <!-- A lista de campeonatos será carregada aqui pelo JavaScript -->
        </ul>

        <h2>Disputas Abertas (Desafios)</h2>
        <ul id="desafios-list" class="list-container">
            <!-- A lista de desafios será carregada aqui pelo JavaScript -->
        </ul>
    </div>

    <script>
        const API_URL = 'https://gameson.onrender.com/api';
        const formCampeonato = document.getElementById('form-criar-campeonato');
        const campeonatosList = document.getElementById('campeonatos-list');
        const desafiosList = document.getElementById('desafios-list');
        const messageDiv = document.getElementById('message');

        // ID do usuário que está logado (para teste, vamos usar o ID 7)
        const USUARIO_LOGADO_ID = 7;

        // Função para exibir mensagens
        function showMessage(text, isError = false) {
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
            messageDiv.style.display = 'block';
            setTimeout(() => { messageDiv.style.display = 'none'; }, 5000);
        }

        // Função para buscar e exibir os campeonatos
        async function fetchCampeonatos() {
            try {
                const response = await fetch(`${API_URL}/campeonatos`);
                if (!response.ok) throw new Error('Falha ao buscar campeonatos.');
                const campeonatos = await response.json();
                campeonatosList.innerHTML = '';
                if (campeonatos.length === 0) {
                    campeonatosList.innerHTML = '<li class="item">Nenhum campeonato aberto no momento.</li>';
                    return;
                }
                campeonatos.forEach(campeonato => {
                    const li = document.createElement('li');
                    li.className = 'item';
                    li.innerHTML = `
                        <h3>${campeonato.nome}</h3>
                        <p><strong>Modalidade:</strong> ${campeonato.modalidade}</p>
                        <p><strong>Inscrição:</strong> R$ ${parseFloat(campeonato.valor_inscricao).toFixed(2)}</p>
                        <p><strong>Pote Atual:</strong> R$ ${parseFloat(campeonato.pote_total).toFixed(2)}</p>
                    `;
                    campeonatosList.appendChild(li);
                });
            } catch (error) {
                showMessage('Erro ao carregar a lista de campeonatos.', true);
                console.error(error);
            }
        }

        // Função para buscar e exibir os desafios
        async function fetchDesafios() {
            try {
                const response = await fetch(`${API_URL}/disputas/abertos`);
                if (!response.ok) throw new Error('Falha ao buscar desafios.');
                const desafios = await response.json();
                desafiosList.innerHTML = '';
                if (desafios.length === 0) {
                    desafiosList.innerHTML = '<li class="item">Nenhum desafio aberto no momento.</li>';
                    return;
                }
                desafios.forEach(desafio => {
                    const li = document.createElement('li');
                    li.className = 'item';
                    li.innerHTML = `
                        <h3>${desafio.titulo}</h3>
                        <p><strong>Criador:</strong> ${desafio.criador_nome}</p>
                        <p><strong>Desafiado:</strong> ${desafio.desafiado_nome}</p>
                        <p><strong>Aposta do Criador:</strong> R$ ${parseFloat(desafio.valor_aposta_criador).toFixed(2)}</p>
                        <div class="actions">
                            <button onclick="mostrarFormularioAceite(${desafio.id})">Aceitar Desafio</button>
                            <div id="form-aceite-${desafio.id}" class="accept-form" style="display: none;">
                                <h4>Aceitar este desafio e definir sua aposta</h4>
                                <form onsubmit="aceitarDesafio(event, ${desafio.id})">
                                    <label>Seu valor da aposta:</label>
                                    <input type="number" step="0.01" required>
                                    <button type="submit">Apostar e Aceitar</button>
                                </form>
                            </div>
                        </div>
                    `;
                    desafiosList.appendChild(li);
                });
            } catch (error) {
                showMessage('Erro ao carregar a lista de desafios.', true);
                console.error(error);
            }
        }
        
        // Função para mostrar/esconder o formulário de aceite
        function mostrarFormularioAceite(disafioId) {
            const formDiv = document.getElementById(`form-aceite-${desafioId}`);
            formDiv.style.display = formDiv.style.display === 'none' ? 'block' : 'none';
        }

        // Função para enviar o aceite do desafio
        async function aceitarDesafio(event, disputaId) {
            event.preventDefault(); // Impede o recarregamento da página
            const form = event.target;
            const valorAposta = parseFloat(form.querySelector('input[type="number"]').value);

            if (!valorAposta || valorAposta <= 0) {
                alert('Por favor, insira um valor de aposta válido.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/disputas/${disputaId}/aceitar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuario_id: USUARIO_LOGADO_ID,
                        valor_aposta_desafiado: valorAposta
                    })
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'Erro ao aceitar o desafio.');
                }

                showMessage(result.message || 'Desafio aceito com sucesso!');
                form.style.display = 'none'; // Esconde o formulário após o sucesso
                fetchDesafios(); // Recarrega a lista de desafios abertos

            } catch (error) {
                showMessage(`Erro: ${error.message}`, true);
                console.error(error);
            }
        }

        // Event listener para o formulário de criação de campeonato
        formCampeonato.addEventListener('submit', async (event) => {
            event.preventDefault();
            const dadosCampeonato = {
                criador_id: parseInt(document.getElementById('criador_id').value),
                nome: document.getElementById('nome').value,
                modalidade: document.getElementById('modalidade').value,
                valor_inscricao: parseFloat(document.getElementById('valor_inscricao').value),
                distribuicao_premios: {
                    "1": parseFloat(document.getElementById('premio_1').value)
                }
            };

            try {
                const response = await fetch(`${API_URL}/campeonatos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosCampeonato),
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'Erro ao criar campeonato.');
                }

                showMessage('Campeonato criado com sucesso!');
                formCampeonato.reset();
                fetchCampeonatos();

            } catch (error) {
                showMessage(`Erro: ${error.message}`, true);
                console.error(error);
            }
        });

        // Carrega as listas quando a página é aberta
        document.addEventListener('DOMContentLoaded', () => {
            fetchCampeonatos();
            fetchDesafios();
        });
    </script>

</body>
</html>
